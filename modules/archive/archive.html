<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ORB - Archives</title>
    <link href="https://fonts.googleapis.com/css2?family=Anton&family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../../style.css">
    <link rel="stylesheet" href="archive.css">
</head>
<body>
    <header class="app-header">
        <div class="header-content" style="display: flex; align-items: center; max-width: 1200px; margin: 0 auto; width: 100%;">
            <a href="../../index.html" onclick="sessionStorage.clear()" class="btn-icon header-back-btn" style="padding: 0; display: flex; align-items: center; text-decoration: none;" title="Accueil">
                <svg viewBox="0 0 24 24" style="width:28px; height:28px; fill:currentColor;"><path d="M20,11V13H8L13.5,18.5L12.08,19.92L4.16,12L12.08,4.08L13.5,5.5L8,11H20Z" /></svg>
            </a>
            <h1 style="margin: 0; text-align: center; flex-grow: 1; padding-right: 40px;">ORB <span class="highlight">ARCHIVES</span></h1>
        </div>
    </header>

    <main id="main-view" style="max-width: 1000px; margin: 40px auto; padding: 0 20px;">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; flex-wrap: wrap; gap: 10px;">
            <div style="display: flex; align-items: center; gap: 15px; flex-wrap: wrap;">
                <h2 style="margin: 0; color: var(--color-primary); font-family: 'Anton';">Équipes Archivées</h2>
                <button id="btn-manage-archive-tags" class="btn-icon" style="padding: 6px; background: transparent; border: 1px solid var(--color-border); border-radius: 8px; color: var(--color-text);" title="Gérer les Tags">
                    <svg viewBox="0 0 24 24" style="width:20px; height:20px; fill:currentColor;"><path d="M21.41 11.58L12.41 2.58C12.05 2.22 11.55 2 11 2H4C2.9 2 2 2.9 2 4V11C2 11.55 2.22 12.05 2.59 12.41L11.58 21.41C11.95 21.77 12.45 22 13 22C13.55 22 14.05 21.77 14.41 21.41L21.41 14.41C21.78 14.05 22 13.55 22 13C22 12.45 21.77 11.95 21.41 11.58M13 20L4 11V4H11L20 13L13 20M6.5 5C7.33 5 8 5.67 8 6.5S7.33 8 6.5 8 5 7.33 5 6.5 5.67 5 6.5 5Z"/></svg>
                </button>
                <button id="btn-reorder-archive-tags" class="btn-icon" style="padding: 6px; background: transparent; border: 1px solid var(--color-border); border-radius: 8px; color: var(--color-text);" title="Ordre d'affichage des tags">
                    <svg viewBox="0 0 24 24" style="width:20px; height:20px; fill:currentColor;"><path d="M3,13H21V11H3V13M3,17H21V15H3V17M3,9H21V7H3V9Z"/></svg>
                </button>
            </div>
            <div id="archive-filter-container" style="display: flex; gap: 10px; flex-wrap: wrap;">
                <!-- Filtres -->
            </div>
        </div>
        <div id="archive-list" class="archive-grid"></div>
    </main>

    <main id="detail-view" class="hidden" style="max-width: 1000px; margin: 40px auto; padding: 0 20px;">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; flex-wrap: wrap; gap: 10px;">
            <div style="display: flex; align-items: center; gap: 15px;">
                <button id="btn-back-archive" class="btn-icon" style="padding: 0; background: transparent; border: none; cursor: pointer; color: var(--color-text);" title="Retour">
                    <svg viewBox="0 0 24 24" style="width:28px; height:28px; fill:currentColor;"><path d="M20,11V13H8L13.5,18.5L12.08,19.92L4.16,12L12.08,4.08L13.5,5.5L8,11H20Z" /></svg>
                </button>
                <h2 id="detail-title" style="margin: 0; color: var(--color-primary); font-family: 'Anton';">Nom de l'équipe</h2>
            </div>
            <div style="display: flex; align-items: center; gap: 10px; flex-wrap: wrap;">
                <button id="btn-assign-tags" class="btn-primary" style="background: transparent; border: 1px solid var(--color-border); color: var(--color-text); padding: 8px 15px;">Assigner des Tags</button>
                <button id="btn-unarchive-team" class="btn-primary" style="background: transparent; border: 1px solid var(--color-primary); color: var(--color-primary); padding: 8px 15px;">Désarchiver l'équipe</button>
            </div>
        </div>
        <div id="roster-list" class="roster-grid"></div>
    </main>

    <!-- Modale Gérer les Tags d'Archives -->
    <div id="archive-tags-modal" class="modal-overlay hidden" style="position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: rgba(0,0,0,0.7); backdrop-filter: blur(5px); z-index: 3000; display: flex; justify-content: center; align-items: center;">
        <div style="background: var(--color-container); border-radius: 12px; width: 450px; max-width: 90vw; padding: 25px; box-shadow: var(--shadow-lifted); border: 1px solid var(--color-border);">
            <h2 style="margin-top: 0; color: var(--color-primary); font-family: var(--font-title);">Gérer les Tags d'Archives</h2>
            <div style="display: flex; gap: 10px; margin-bottom: 15px;">
                <input type="text" id="new-archive-tag-input" placeholder="Nouveau tag..." style="flex-grow: 1; padding: 10px; border-radius: 8px; border: 1px solid var(--color-border); background: var(--color-background); color: var(--color-text);">
                <button id="btn-add-archive-tag" class="btn-primary">Ajouter</button>
            </div>
            <div id="archive-tags-list" style="display: flex; flex-direction: column; gap: 10px; max-height: 300px; overflow-y: auto;">
                <!-- Liste des tags -->
            </div>
            <div style="display: flex; justify-content: flex-end; margin-top: 20px;">
                <button id="btn-close-archive-tags-modal" style="padding: 10px 20px; border-radius: 8px; border: 1px solid var(--color-border); background: transparent; color: var(--color-text); cursor: pointer;">Fermer</button>
            </div>
        </div>
    </div>

    <!-- Modale Assigner Tags à l'équipe -->
    <div id="assign-tags-modal" class="modal-overlay hidden" style="position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: rgba(0,0,0,0.7); backdrop-filter: blur(5px); z-index: 3000; display: flex; justify-content: center; align-items: center;">
        <div style="background: var(--color-container); border-radius: 12px; width: 400px; max-width: 90vw; padding: 25px; box-shadow: var(--shadow-lifted); border: 1px solid var(--color-border);">
            <h2 style="margin-top: 0; color: var(--color-primary); font-family: var(--font-title);">Assigner des Tags</h2>
            <div id="assign-tags-list" style="display: flex; flex-direction: column; gap: 10px; max-height: 300px; overflow-y: auto; margin-bottom: 20px;">
                <!-- Checkboxes -->
            </div>
            <div style="display: flex; justify-content: flex-end; gap: 10px;">
                <button id="btn-close-assign-tags" style="padding: 10px 20px; border-radius: 8px; border: 1px solid var(--color-border); background: transparent; color: var(--color-text); cursor: pointer;">Annuler</button>
                <button id="btn-save-assign-tags" class="btn-primary">Enregistrer</button>
            </div>
        </div>
    </div>

    <script src="../../core/db.js"></script>
    <script src="archive.js"></script>
    <script>
        if (localStorage.getItem('theme') === 'light') document.body.classList.add('light-mode');
        if (localStorage.getItem('teamMode') === 'crab') document.body.classList.add('crab-mode');
    </script>
    <script src="../../core/reorder.js"></script>
</body>
</html>
